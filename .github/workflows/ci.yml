name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [. , plugins/auto-switcher-pro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Verify no orphan build artifacts in source tree
        run: |
          set -euo pipefail
          STRAY=$(find plugins/ -type f \( -name "*.h" -o -name "*.so" \) ! -path "*/bin/*" || true)
          if [ -n "$STRAY" ]; then
            echo "Error: Orphan build artifacts detected outside bin/:"
            echo "$STRAY"
            exit 1
          fi

  web:
    name: Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/auto-switcher-pro/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugins/auto-switcher-pro/web/package-lock.json
      - run: npm ci
      - run: npx vitest run

  extension:
    name: Pi Extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/cpamc-auto-switcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --experimental-strip-types --test src/*.test.ts
